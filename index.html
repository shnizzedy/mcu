<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fox Marvel: Multiversal Chronology</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; margin: 0; overflow: hidden; }
        .tt-link { fill: none; stroke: #00d4ff; stroke-width: 1.5px; opacity: 0.2; pointer-events: none; }
        .node image { border-radius: 4px; border: 1px solid #333; transition: 0.2s; }
        .node:hover image { transform: scale(1.6); border-color: #f2d024; z-index: 100; }
        .label { font-size: 10px; fill: #aaa; pointer-events: none; text-shadow: 1px 1px #000; }
        
        #axis-overlay { position: fixed; left: 0; top: 0; width: 140px; height: 100%; background: linear-gradient(to right, #050505 85%, transparent); z-index: 20; pointer-events: none; border-right: 1px solid #222; }
        .lane-label { font-size: 10px; font-weight: 900; fill: #f2d024; text-transform: uppercase; }
        h1 { position: fixed; top: 10px; left: 20px; color: #f2d024; font-size: 14px; z-index: 30; letter-spacing: 2px; }
    </style>
</head>
<body>
    <h1>FOX MARVEL MULTIVERSE CHRONOLOGY</h1>
    <div id="axis-overlay"></div>
    <div id="viz"></div>

    <script>
        const width = window.innerWidth, height = window.innerHeight;
        const svg = d3.select("#viz").append("svg").attr("width", width).attr("height", height);
        const g = svg.append("g");
        const axisSvg = d3.select("#axis-overlay").append("svg").attr("width", 140).attr("height", height);

        const lanes = {
            "Earth-TRN620": height * 0.15, 
            "Earth-121698": height * 0.28,
            "Earth-158664": height * 0.40,
            "Earth-10005":  height * 0.52,
            "Earth-TRN414": height * 0.65,
            "Earth-41633":  height * 0.78,
            "Earth-TRN634": height * 0.88,
            "Earth-17315":  height * 0.94 
        };

        Object.entries(lanes).forEach(([name, y]) => {
            axisSvg.append("text").attr("class", "lane-label").attr("x", 15).attr("y", y + 4).text(name);
        });

        const zoom = d3.zoom()
            .scaleExtent([0.1, 2])
            .on("zoom", (e) => g.attr("transform", e.transform));
        
        svg.call(zoom);

        // FIXED Keyboard Scrolling Logic
        d3.select(window).on("keydown", (e) => {
            const currentTransform = d3.zoomTransform(svg.node());
            let { x, y, k } = currentTransform;
            const step = 300; 

            if (e.key === "ArrowRight") x -= step;
            if (e.key === "ArrowLeft") x += step;
            
            svg.transition().duration(200).call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(k));
        });

        d3.tsv("data.tsv").then(data => {
            data.sort((a, b) => parseFloat(a.year) - parseFloat(b.year));
            const xScale = d3.scaleLinear().domain([0, data.length]).range([200, data.length * 180]);

            const getY = (d) => lanes[d.lane.trim()] || height / 2;

            data.forEach((d, i) => {
                d.xPos = xScale(i);
                d.yPos = getY(d);
            });

            const links = [];
            data.forEach((d) => {
                if (d.connections) {
                    d.connections.split(",").forEach(tId => {
                        const target = data.find(m => m.id.trim() === tId.trim());
                        if(target) links.push({ s: d, t: target });
                    });
                }
            });

            g.selectAll(".tt-link").data(links).enter().append("path")
                .attr("class", "tt-link")
                .attr("d", d => {
                    const midX = (d.s.xPos + d.t.xPos) / 2;
                    // For the Legion loop (far right to far left), we use a deeper curve
                    const curveType = Math.abs(d.s.xPos - d.t.xPos) > 2000 ? 1.5 : 1;
                    return `M${d.s.xPos},${d.s.yPos} C${midX},${d.s.yPos} ${midX},${d.t.yPos} ${d.t.xPos},${d.t.yPos}`;
                });

            const nodes = g.selectAll(".node").data(data).enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.xPos}, ${d.yPos})`);

            nodes.append("image")
                .attr("xlink:href", d => d.image)
                .attr("x", -35).attr("y", -50).attr("width", 70).attr("height", 100);

            nodes.append("text").attr("class", "label").attr("text-anchor", "middle").attr("y", 65)
                .text(d => d.title);
        });
    </script>
</body>
</html>
