<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fox Marvel Sequence Timeline</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #080808; color: #fff; margin: 0; overflow: hidden; }
        .tt-link { fill: none; stroke: #00d4ff; stroke-width: 1.5px; stroke-dasharray: 4,4; opacity: 0.6; }
        .node image { border-radius: 4px; transition: 0.2s ease; cursor: pointer; }
        .node:hover image { transform: scale(1.6) translateY(-10px); z-index: 100; filter: brightness(1.2); }
        .label { font-size: 10px; fill: #999; pointer-events: none; }
        .lane-label { font-size: 12px; font-weight: 800; fill: #444; text-transform: uppercase; letter-spacing: 2px; }
        h1 { position: fixed; top: 10px; left: 20px; color: #f2d024; font-size: 18px; z-index: 10; opacity: 0.8; }
    </style>
</head>
<body>
    <h1>Fox Marvel Universe: Sequence View</h1>
    <div id="viz"></div>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        const svg = d3.select("#viz").append("svg")
            .attr("width", width).attr("height", height)
            .call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)));

        const g = svg.append("g");

        d3.tsv("data.tsv").then(data => {
            // Sort by absolute release sequence
            data.sort((a, b) => parseFloat(a.year) - parseFloat(b.year));

            // Horizontal Scale: Dynamic Sequence (not absolute time)
            const x = d3.scaleLinear()
                .domain([0, data.length - 1])
                .range([100, data.length * 120]); 

            const lanes = {
                "Earth-TRN620": height * 0.15,
                "Earth-121698": height * 0.30,
                "Earth-10005":  height * 0.45,
                "Earth-TRN414": height * 0.60,
                "Earth-41633":  height * 0.75,
                "Earth-TRN634": height * 0.90
            };

            // Jitter function to prevent vertical overlap
            const getJitter = (i) => (i % 2 === 0 ? -25 : 25);

            // Draw Connections
            const links = [];
            data.forEach((d, i) => {
                d.idx = i;
                if (d.connections) {
                    d.connections.split(",").forEach(tId => {
                        const target = data.find(m => m.id == tId);
                        if(target) links.push({ s: d, t: target });
                    });
                }
            });

            g.selectAll(".tt-link").data(links).enter().append("path")
                .attr("class", "tt-link")
                .attr("d", d => {
                    const x1 = x(d.s.idx), y1 = lanes[d.s.lane] + getJitter(d.s.idx);
                    const x2 = x(d.t.idx), y2 = lanes[d.t.lane] + getJitter(d.t.idx);
                    return `M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`;
                });

            // Nodes
            const nodes = g.selectAll(".node").data(data).enter().append("g")
                .attr("class", "node")
                .attr("transform", (d, i) => `translate(${x(i)}, ${lanes[d.lane] + getJitter(i)})`);

            nodes.append("image")
                .attr("xlink:href", d => d.image)
                .attr("x", -30).attr("y", -45).attr("width", 60).attr("height", 90)
                .on("error", function() { d3.select(this).attr("xlink:href", "https://via.placeholder.com/60x90?text=Missing"); });

            nodes.append("text").attr("class", "label").attr("text-anchor", "middle").attr("y", 60)
                .text(d => d.title.split(":")[0]);
        });
    </script>
</body>
</html>
